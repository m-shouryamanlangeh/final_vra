<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Adverse Screening{% endblock %} · ERM</title>
    <link rel="icon" type="image/svg+xml" href="/static/erm-logo.svg">
    <script>
      // Pre-paint theme application — prevents flash-of-wrong-theme.
      // Sets BOTH our custom `dark` class and Bootstrap's `data-bs-theme`
      // so every component (incl. Bootstrap tables/forms) follows the theme.
      (function () {
        try {
          var t = localStorage.getItem('theme');
          var dark = t === 'dark' || (!t && window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches);
          var root = document.documentElement;
          root.classList.toggle('dark', dark);
          root.setAttribute('data-bs-theme', dark ? 'dark' : 'light');
        } catch (e) {}
      })();
    </script>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Geist:wght@300;400;500;600;700&display=swap">

    <style>
        :root {
            --paytm-blue:  #00BAF2;
            --paytm-dark:  #002970;
            --paytm-bg:    #F5F7FA;
            --paytm-tint:  #e0f4fc;

            --slate-50:  #f8fafc;
            --slate-100: #f1f5f9;
            --slate-200: #e2e8f0;
            --slate-300: #cbd5e1;
            --slate-400: #94a3b8;
            --slate-500: #64748b;
            --slate-600: #475569;
            --slate-700: #334155;

            --success-green: #10b981;
            --warning-amber: #f59e0b;
            --danger-rose:   #e11d48;

            --sidebar-w-collapsed: 60px;
            --sidebar-w-expanded: 220px;
        }

        body {
            font-family: "Geist", "Inter", -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
            background: var(--paytm-bg);
            color: var(--paytm-dark);
            min-height: 100vh;
            -webkit-font-smoothing: antialiased;
            padding-left: var(--sidebar-w-collapsed);
            padding-bottom: 3rem;
        }

        /* ─── Header ───────────────────────────────────────────────── */
        .dashboard-header {
            background: #ffffff;
            color: var(--paytm-dark);
            margin-bottom: 1.75rem;
            border-bottom: 1px solid var(--slate-200);
            position: sticky; top: 0; z-index: 40;
            box-shadow: 0 1px 2px rgba(0,0,0,0.04);
        }
        .dashboard-header .brand-row { min-height: 72px; display: flex; align-items: center; gap: 16px; }
        .dashboard-header .brand-logo { display: flex; align-items: center; gap: 12px; text-decoration: none; }
        .dashboard-header .brand-logo img { height: 30px; width: auto; display: block; }
        .dashboard-header .brand-divider { width: 1px; height: 32px; background: var(--slate-200); }
        .dashboard-header h1 {
            font-size: 16px !important; font-weight: 600; color: var(--paytm-dark);
            letter-spacing: -0.01em; line-height: 1.15; margin: 0 !important;
        }
        .dashboard-header .brand-sub {
            font-size: 10.5px; color: var(--slate-400); font-weight: 500;
            text-transform: uppercase; letter-spacing: 0.12em; margin-top: 2px;
        }
        .dashboard-header .right-meta { color: var(--slate-500); font-size: 13px; }

        /* ─── Sidebar ──────────────────────────────────────────────── */
        .app-sidebar {
            position: fixed; top: 0; left: 0; bottom: 0;
            width: var(--sidebar-w-collapsed);
            background: #ffffff; border-right: 1px solid var(--slate-200);
            z-index: 1050; display: flex; flex-direction: column;
            padding: 12px 8px; overflow: hidden;
            transition: width .26s cubic-bezier(.25,.1,.25,1), box-shadow .26s;
        }
        .app-sidebar:hover { width: var(--sidebar-w-expanded); box-shadow: 4px 0 24px rgba(2,6,23,0.10); }
        .app-sidebar .sb-logo {
            display: flex; align-items: center; gap: 10px;
            padding: 6px 8px 14px; border-bottom: 1px solid var(--slate-100);
            margin-bottom: 10px; text-decoration: none;
        }
        .app-sidebar .sb-logo img { height: 28px; width: 28px; min-width: 28px; }
        .app-sidebar .sb-logo .sb-logo-text {
            font-size: 12px; font-weight: 700; letter-spacing: 0.08em;
            color: var(--paytm-dark); text-transform: uppercase; white-space: nowrap;
            opacity: 0; transform: translateX(-6px); transition: opacity .22s, transform .22s;
        }
        .app-sidebar:hover .sb-logo .sb-logo-text { opacity: 1; transform: translateX(0); }
        .app-sidebar .sb-links { display: flex; flex-direction: column; gap: 2px; flex: 1 1 auto; margin-top: 2px; }
        .app-sidebar .sb-link {
            display: flex; align-items: center; gap: 12px; padding: 9px 10px;
            border: none; background: transparent; color: var(--slate-600);
            border-radius: 9px; font-size: 13.5px; font-weight: 500;
            text-decoration: none; cursor: pointer; font-family: inherit;
            text-align: left; white-space: nowrap; transition: background .15s, color .15s;
        }
        .app-sidebar .sb-link:hover { background: var(--paytm-tint); color: var(--paytm-dark); }
        .app-sidebar .sb-link.active {
            background: var(--paytm-tint); color: var(--paytm-dark);
            box-shadow: inset 3px 0 0 var(--paytm-blue); font-weight: 600;
        }
        .app-sidebar .sb-link .sb-ico {
            width: 28px; min-width: 28px; height: 28px;
            display: inline-flex; align-items: center; justify-content: center; font-size: 15px;
        }
        .app-sidebar .sb-link .sb-label {
            opacity: 0; transform: translateX(-6px); transition: opacity .25s, transform .25s;
            overflow: hidden; text-overflow: ellipsis;
        }
        .app-sidebar:hover .sb-link .sb-label { opacity: 1; transform: translateX(0); }
        .app-sidebar .sb-foot {
            flex-shrink: 0; border-top: 1px solid var(--slate-100);
            padding-top: 10px; margin-top: 8px;
        }
        .app-sidebar .sb-foot .sb-team {
            font-size: 10px; color: var(--slate-400); padding: 6px 10px;
            white-space: nowrap; opacity: 0; transition: opacity .25s;
        }
        .app-sidebar:hover .sb-foot .sb-team { opacity: 1; }

        @media (max-width: 768px) {
            .app-sidebar { display: none; }
            body { padding-left: 0; }
        }

        /* ─── Theme toggle ─────────────────────────────────────────── */
        .theme-toggle {
            width: 64px; height: 32px; padding: 4px; border-radius: 9999px;
            border: 1px solid var(--slate-200); background: #ffffff;
            display: inline-flex; align-items: center; cursor: pointer;
            transition: background .3s, border-color .3s; margin-left: 10px;
            -webkit-tap-highlight-color: transparent;
        }
        html.dark .theme-toggle { background: #09090b; border-color: #27272a; }
        .theme-toggle:focus-visible { outline: none; box-shadow: 0 0 0 3px rgba(0,186,242,0.30); }
        .theme-toggle .tt-row { display: flex; align-items: center; justify-content: space-between; width: 100%; }
        .theme-toggle .tt-slot {
            width: 24px; height: 24px; border-radius: 9999px;
            display: inline-flex; align-items: center; justify-content: center;
            transition: transform .3s, background .3s, color .3s;
        }
        .theme-toggle .tt-active { background: #e5e7eb; color: #374151; transform: translateX(32px); }
        html.dark .theme-toggle .tt-active { background: #27272a; color: #fff; transform: translateX(0); }
        .theme-toggle .tt-muted { background: transparent; color: #6b7280; transform: translateX(-32px); }
        html.dark .theme-toggle .tt-muted { transform: translateX(0); color: #6b7280; }
        .theme-toggle .tt-active i, .theme-toggle .tt-muted i { font-size: 14px; line-height: 1; }
        .theme-toggle .tt-active .sun  { display: inline-block; }
        .theme-toggle .tt-active .moon { display: none; }
        .theme-toggle .tt-muted  .moon { display: inline-block; }
        .theme-toggle .tt-muted  .sun  { display: none; }
        html.dark .theme-toggle .tt-active .sun  { display: none; }
        html.dark .theme-toggle .tt-active .moon { display: inline-block; }
        html.dark .theme-toggle .tt-muted  .moon { display: none; }
        html.dark .theme-toggle .tt-muted  .sun  { display: inline-block; }

        /* ─── Cards ────────────────────────────────────────────────── */
        .section-card {
            background: #ffffff; border: 1px solid var(--slate-200);
            border-radius: 14px; box-shadow: 0 1px 2px rgba(0,0,0,0.04);
            overflow: hidden; margin-bottom: 20px; transition: box-shadow .2s, border-color .2s;
        }
        .section-card:hover { box-shadow: 0 4px 14px rgba(0,41,112,0.05); }
        .section-card-head {
            display: flex; align-items: center; gap: 14px; padding: 18px 22px;
            border-bottom: 1px solid var(--slate-100);
            background: linear-gradient(to right, var(--slate-50), #ffffff);
        }
        .section-card-head .icon-chip {
            width: 40px; height: 40px; border-radius: 10px;
            display: flex; align-items: center; justify-content: center;
            background: var(--paytm-tint); color: var(--paytm-dark); font-size: 15px; flex-shrink: 0;
        }
        .section-card-head .icon-chip.navy { background: var(--paytm-dark); color: #fff; }
        .section-card-head .icon-chip.cyan { background: var(--paytm-blue); color: #fff; }
        .section-card-head .titles { flex: 1; min-width: 0; }
        .section-card-head h3 {
            margin: 0; font-size: 15px; font-weight: 600; color: var(--paytm-dark);
            letter-spacing: -0.01em; line-height: 1.2;
        }
        .section-card-head .subtitle { margin-top: 2px; font-size: 12.5px; color: var(--slate-500); line-height: 1.4; }
        .section-card-head .right-actions { display: flex; align-items: center; gap: 8px; }
        .section-card-body { padding: 18px 22px; }

        .sub-block { border: 1px solid var(--slate-200); border-radius: 10px; padding: 14px 16px; background: var(--slate-50); }
        .sub-block .sub-label {
            font-size: 10.5px; font-weight: 600; color: var(--slate-500);
            text-transform: uppercase; letter-spacing: 0.1em; margin-bottom: 10px; display: block;
        }
        .empty-state {
            font-size: 12.5px; color: var(--slate-400); font-style: italic;
            padding: 14px; background: var(--slate-50); border: 1px dashed var(--slate-200);
            border-radius: 8px; text-align: center;
        }

        /* ─── Metric cards ─────────────────────────────────────────── */
        .metric-card {
            position: relative; text-align: left; padding: 18px 20px;
            background: #ffffff; border: 1px solid var(--slate-200); border-radius: 14px;
            box-shadow: 0 1px 2px rgba(0,0,0,0.04);
            transition: box-shadow .2s, border-color .2s, transform .2s; min-height: 100px;
        }
        .metric-card:hover { box-shadow: 0 6px 16px rgba(0,41,112,0.07); border-color: var(--paytm-blue); transform: translateY(-1px); }
        .metric-card .metric-icon {
            position: absolute; top: 14px; right: 14px; width: 36px; height: 36px;
            border-radius: 10px; display: flex; align-items: center; justify-content: center;
            background: var(--paytm-tint); color: var(--paytm-dark); font-size: 14px;
        }
        .metric-card .metric-icon.amber { background: #fef3c7; color: #92400e; }
        .metric-card .metric-icon.cyan  { background: var(--paytm-tint); color: var(--paytm-dark); }
        .metric-card .metric-icon.emerald { background: #d1fae5; color: #047857; }
        .metric-card .metric-icon.rose { background: #fee2e2; color: #b91c1c; }
        .metric-card .metric-label {
            color: var(--slate-500); font-size: 11px; text-transform: uppercase;
            letter-spacing: 0.1em; font-weight: 600; margin: 0;
        }
        .metric-card .metric-number {
            font-size: 2.1rem; font-weight: 600; color: var(--paytm-dark);
            letter-spacing: -0.02em; line-height: 1.1; margin-top: 6px;
        }
        .metric-card .metric-sub { font-size: 11.5px; color: var(--slate-400); margin-top: 4px; }

        /* ─── Buttons ──────────────────────────────────────────────── */
        .btn-primary {
            background: var(--paytm-dark) !important; border: 1px solid var(--paytm-dark) !important;
            color: #fff !important; border-radius: 6px; padding: 8px 18px; font-weight: 600;
            font-size: 13px; box-shadow: 0 1px 2px rgba(0,0,0,0.05); transition: background .15s;
        }
        .btn-primary:hover { background: #001a4f !important; border-color: #001a4f !important; box-shadow: 0 2px 6px rgba(0,41,112,0.18); }
        .btn-info { background: var(--paytm-blue) !important; border: 1px solid var(--paytm-blue) !important; color: #fff !important; border-radius: 6px; padding: 8px 18px; font-weight: 600; font-size: 13px; }
        .btn-info:hover { background: #0095c4 !important; border-color: #0095c4 !important; color: #fff !important; }
        .btn-light-outline {
            background: #fff; color: var(--paytm-dark); border: 1px solid var(--slate-200);
            border-radius: 6px; padding: 8px 16px; font-weight: 600; font-size: 13px;
            text-decoration: none; display: inline-flex; align-items: center; gap: 6px; transition: all .15s;
        }
        .btn-light-outline:hover { background: var(--paytm-tint); border-color: var(--paytm-blue); color: var(--paytm-dark); }
        .btn-lg { padding: 10px 22px; font-size: 14px; }
        .btn-sm { padding: 5px 12px; font-size: 12px; }

        /* ─── Form controls ────────────────────────────────────────── */
        .form-label { font-size: 11px; text-transform: uppercase; letter-spacing: 0.08em; font-weight: 600; color: var(--slate-500); margin-bottom: 5px; }
        .form-control {
            border: 1px solid var(--slate-200); border-radius: 8px; font-size: 13.5px;
            padding: 9px 12px; color: var(--paytm-dark); background: #fff;
        }
        .form-control:focus { border-color: var(--paytm-blue); box-shadow: 0 0 0 3px rgba(0,186,242,0.18); }
        .form-text { color: var(--slate-400); font-size: 11.5px; }

        /* ─── Tables ───────────────────────────────────────────────── */
        .table { color: var(--paytm-dark); }
        .table thead th {
            font-size: 11px; text-transform: uppercase; letter-spacing: 0.08em;
            font-weight: 600; color: var(--slate-500); border-bottom: 1px solid var(--slate-200);
        }
        .table-hover tbody tr:hover { background-color: var(--paytm-tint); }
        .table td { vertical-align: middle; font-size: 13px; }

        /* ─── Badges ───────────────────────────────────────────────── */
        .badge { border-radius: 999px; padding: 4px 11px; font-weight: 600; font-size: 11px; letter-spacing: 0.02em; }
        .badge-high, .badge-reject, .badge-hit { background: #fee2e2; color: #991b1b; border: 1px solid #fca5a5; }
        .badge-medium, .badge-conditional, .badge-manual { background: #fef3c7; color: #92400e; border: 1px solid #fcd34d; }
        .badge-low, .badge-proceed, .badge-clear { background: #d1fae5; color: #065f46; border: 1px solid #6ee7b7; }
        .badge-unverified { background: var(--slate-100); color: var(--slate-600); border: 1px solid var(--slate-200); }

        /* ─── Risk hero ────────────────────────────────────────────── */
        .risk-hero { display: flex; align-items: center; gap: 20px; flex-wrap: wrap; }
        .risk-dial {
            width: 96px; height: 96px; border-radius: 50%; flex-shrink: 0;
            display: flex; align-items: center; justify-content: center; flex-direction: column;
            color: #fff; font-weight: 700;
        }
        .risk-dial.HIGH { background: linear-gradient(135deg, #ef4444, #b91c1c); }
        .risk-dial.MEDIUM { background: linear-gradient(135deg, #f59e0b, #d97706); }
        .risk-dial.LOW { background: linear-gradient(135deg, #10b981, #059669); }
        .risk-dial .rd-score { font-size: 1.7rem; line-height: 1; }
        .risk-dial .rd-of { font-size: 10px; opacity: 0.85; }

        /* ─── Executive summary card ───────────────────────────────── */
        .ai-summary {
            border: 1px solid rgba(0,186,242,0.35); border-radius: 12px;
            background: linear-gradient(135deg, rgba(0,186,242,0.07), rgba(0,41,112,0.05));
            padding: 16px 18px;
        }
        .ai-summary-head {
            display: flex; align-items: center; gap: 8px; margin-bottom: 8px;
            font-size: 11px; font-weight: 700; text-transform: uppercase;
            letter-spacing: 0.08em; color: var(--paytm-dark);
        }
        .ai-summary-head i { color: var(--paytm-blue); }
        .ai-summary-head .ai-engine {
            margin-left: auto; text-transform: none; letter-spacing: 0; font-weight: 600;
            font-size: 10.5px; color: var(--slate-500);
            background: var(--paytm-tint); border-radius: 999px; padding: 2px 10px;
        }
        .ai-summary p { font-size: 13.5px; color: var(--slate-700); line-height: 1.6; }
        html.dark .ai-summary p { color: #cbd5e1; }
        html.dark .ai-summary-head { color: #f1f5f9; }

        /* ─── Spinner overlay ──────────────────────────────────────── */
        .scan-overlay {
            position: fixed; inset: 0; background: rgba(11,18,32,0.55);
            display: none; align-items: center; justify-content: center; z-index: 2000;
            backdrop-filter: blur(2px);
        }
        .scan-overlay.show { display: flex; }
        .scan-card {
            background: #fff; border-radius: 16px; padding: 32px 40px; text-align: center;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3); max-width: 360px;
        }
        .scan-card .spinner-border { color: var(--paytm-blue); width: 3rem; height: 3rem; }
        .scan-card h5 { margin-top: 16px; color: var(--paytm-dark); font-weight: 600; }
        .scan-card p { color: var(--slate-500); font-size: 13px; margin: 4px 0 0; }

        /* ─── Dark mode ────────────────────────────────────────────── */
        html.dark {
            color-scheme: dark;
            --paytm-bg: #0b1220; --paytm-dark: #e2e8f0; --paytm-tint: rgba(0,186,242,0.12);
            --slate-50: #131c2f; --slate-100: #1a2540; --slate-200: #1f2a44; --slate-300: #334155;
            --slate-400: #64748b; --slate-500: #94a3b8; --slate-600: #cbd5e1; --slate-700: #e2e8f0;
        }
        html.dark body { background: var(--paytm-bg); color: var(--paytm-dark); }
        html.dark .dashboard-header { background: #0f172a; border-bottom-color: var(--slate-200); }
        /* Invert logos for dark mode, but keep the ERM mark its original colors. */
        html.dark .brand-logo img:not(.erm-mark), html.dark .sb-logo img:not(.erm-mark) { filter: brightness(0) invert(1); }
        html.dark .dashboard-header h1 { color: #f1f5f9; }
        html.dark .app-sidebar { background: #0a1226; border-right-color: #1f2c4d; }
        html.dark .app-sidebar .sb-logo { border-bottom-color: #1f2c4d; }
        html.dark .app-sidebar .sb-logo .sb-logo-text { color: #f1f5f9; }
        html.dark .app-sidebar .sb-link { color: #94a3b8; }
        html.dark .app-sidebar .sb-link:hover { background: #1a2540; color: #f1f5f9; }
        html.dark .app-sidebar .sb-link.active { background: #1a2540; color: #f1f5f9; box-shadow: inset 3px 0 0 var(--paytm-blue); }
        html.dark .app-sidebar .sb-foot { border-top-color: #1f2c4d; }
        html.dark .section-card, html.dark .metric-card, html.dark .sub-block, html.dark .scan-card { background: #111a2e; border-color: var(--slate-200); }
        html.dark .sub-block { background: #0f172a; }
        html.dark .section-card-head { background: linear-gradient(to right, #131c2f, #111a2e); border-bottom-color: var(--slate-200); }
        html.dark .section-card-head h3, html.dark .metric-card .metric-number, html.dark .scan-card h5 { color: #f1f5f9; }
        html.dark .form-control { background: #0f172a; border-color: var(--slate-200); color: #e2e8f0; }
        html.dark .form-control::placeholder { color: #64748b; }
        html.dark .btn-light-outline { background: #111a2e; color: #cbd5e1; border-color: var(--slate-200); }
        html.dark a { color: var(--paytm-blue); }
        html.dark .table { color: #cbd5e1; --bs-table-bg: transparent; --bs-table-color: #cbd5e1; }
        html.dark .table thead th { color: #94a3b8; border-bottom-color: var(--slate-200); }
        html.dark .table td, html.dark .table th { border-color: var(--slate-200); }
        html.dark .table-hover tbody tr:hover { background-color: rgba(0,186,242,0.10); }
        html.dark .border-bottom { border-color: var(--slate-200) !important; }
        html.dark .empty-state { background: #0f172a; border-color: var(--slate-200); color: #64748b; }
        html.dark .empty-state a { color: var(--paytm-blue); }
        html.dark .form-text { color: #64748b; }
        html.dark .text-danger { color: #fca5a5 !important; }

        /* ─── History delete (X) button ────────────────────────────── */
        .btn-del {
            width: 30px; height: 30px; border-radius: 8px;
            display: inline-flex; align-items: center; justify-content: center;
            border: 1px solid var(--slate-200); background: #fff;
            color: var(--slate-400); cursor: pointer; transition: all .15s; padding: 0;
        }
        .btn-del:hover { background: #fee2e2; border-color: #fca5a5; color: #b91c1c; }
        html.dark .btn-del { background: #111a2e; border-color: var(--slate-200); color: #64748b; }
        html.dark .btn-del:hover { background: #3a1117; border-color: #7f1d1d; color: #fecaca; }
    </style>
    {% block head %}{% endblock %}
</head>
<body>
    <!-- Sidebar -->
    <aside class="app-sidebar" aria-label="Primary navigation">
        <a class="sb-logo" href="/" title="ERM Adverse Screening">
            <img class="erm-mark" src="/static/erm-logo.svg" alt="ERM">
            <span class="sb-logo-text">ERM Screen</span>
        </a>
        <nav class="sb-links">
            <a class="sb-link {% if active == 'screen' %}active{% endif %}" href="/" title="New Screening">
                <span class="sb-ico"><i class="fas fa-magnifying-glass"></i></span>
                <span class="sb-label">New Screening</span>
            </a>
            <a class="sb-link {% if active == 'history' %}active{% endif %}" href="/history" title="Screening History">
                <span class="sb-ico"><i class="fas fa-clock-rotate-left"></i></span>
                <span class="sb-label">History</span>
            </a>
        </nav>
        <div class="sb-foot">
            <div class="sb-team">{{ team }}</div>
        </div>
    </aside>

    <!-- Header -->
    <div class="dashboard-header">
        <div class="container">
            <div class="brand-row">
                <a class="brand-logo" href="/">
                    <img class="paytm-mark" src="/static/paytm-logo.svg" alt="Paytm">
                    <span class="brand-divider" aria-hidden="true"></span>
                    <img class="erm-mark" src="/static/erm-logo.svg" alt="ERM">
                    <span class="brand-divider" aria-hidden="true"></span>
                    <div>
                        <h1>Adverse Media &amp; KYC/AML Screening</h1>
                        <div class="brand-sub">ERM · Enterprise Risk Management</div>
                    </div>
                </a>
                <div class="ms-auto right-meta">
                    <div class="d-flex align-items-center justify-content-end">
                        <span class="d-none d-md-inline">{% block header_meta %}OSINT Screening Portal{% endblock %}</span>
                        <button type="button" id="theme-toggle" class="theme-toggle" role="switch" aria-label="Toggle light / dark theme" title="Toggle theme">
                            <span class="tt-row">
                                <span class="tt-active tt-slot" aria-hidden="true">
                                    <i class="fas fa-moon moon"></i><i class="fas fa-sun sun"></i>
                                </span>
                                <span class="tt-muted tt-slot" aria-hidden="true">
                                    <i class="fas fa-sun sun"></i><i class="fas fa-moon moon"></i>
                                </span>
                            </span>
                        </button>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <div class="container">
        {% block content %}{% endblock %}
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        (function () {
            const btn = document.getElementById('theme-toggle');
            if (btn) btn.addEventListener('click', function () {
                const root = document.documentElement;
                const isDark = root.classList.toggle('dark');
                root.setAttribute('data-bs-theme', isDark ? 'dark' : 'light');
                try { localStorage.setItem('theme', isDark ? 'dark' : 'light'); } catch (e) {}
            });
        })();
    </script>
    {% block scripts %}{% endblock %}
</body>
</html>
